[package]
name = "inbill-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "inbill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.tauri]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pg-embed = { version = "0.7", features = ["rt_tokio"] }
tokio = { version = "1", features = ["full"] }

# Desktop-only: focuses the running window when the app is launched a second
# time (two instances would fight over ports and the Postgres data directory).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[patch.crates-io]
pg-embed = { path = "patches/pg-embed" }
