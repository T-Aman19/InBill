<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InBill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: oklch(14% 0.010 60);
      color: oklch(96% 0.005 70);
      font-family: -apple-system, 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 13px;
      color: oklch(55% 0.010 60);
      margin-bottom: 40px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid oklch(30% 0.010 60);
      border-top-color: oklch(72% 0.010 60);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 12px;
      color: oklch(45% 0.010 60);
      letter-spacing: 0.02em;
      max-width: 460px;
      text-align: center;
      line-height: 1.5;
    }
    /* Error state — spinner swaps for a warning mark, retry + log path appear */
    #errbox { display: none; flex-direction: column; align-items: center; }
    body.error .spinner { display: none; }
    body.error #errbox { display: flex; }
    body.error #status { color: oklch(70% 0.12 45); }
    .errmark {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid oklch(58% 0.16 30);
      color: oklch(70% 0.16 35);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      margin-bottom: 16px;
    }
    #retry {
      margin-top: 22px;
      padding: 9px 26px;
      border-radius: 8px;
      border: 1px solid oklch(35% 0.010 60);
      background: oklch(22% 0.012 60);
      color: oklch(90% 0.005 70);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.01em;
    }
    #retry:hover { background: oklch(26% 0.012 60); }
    #logpath {
      margin-top: 16px;
      font-size: 11px;
      color: oklch(42% 0.010 60);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      max-width: 520px;
      text-align: center;
      word-break: break-all;
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <div class="logo">InBill</div>
  <div class="sub">Point of Sale</div>
  <div id="errbox"><div class="errmark">!</div></div>
  <div class="spinner"></div>
  <div id="status">Starting…</div>
  <div id="errbox2" style="display: contents;">
    <button id="retry" style="display: none;">Retry</button>
    <div id="logpath" style="display: none;"></div>
  </div>
  <script>
    // Marks this page for the Rust side: a Retry run must not reload the splash,
    // and status/error updates are delivered through the two functions below.
    window.__inbillSplash = true;

    var statusEl = document.getElementById('status');
    var retryEl  = document.getElementById('retry');
    var logEl    = document.getElementById('logpath');

    window.__inbillStatus = function (msg) {
      document.body.classList.remove('error');
      retryEl.style.display = 'none';
      statusEl.textContent = msg;
    };

    window.__inbillError = function (msg, logPath) {
      document.body.classList.add('error');
      statusEl.textContent = msg;
      retryEl.style.display = 'inline-block';
      if (logPath) {
        logEl.textContent = 'Log: ' + logPath;
        logEl.style.display = 'block';
      }
    };

    retryEl.addEventListener('click', function () {
      window.__inbillStatus('Retrying…');
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('retry_startup');
      }
    });
  </script>
</body>
</html>
